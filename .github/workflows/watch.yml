name: Watch postal codes

on:
  schedule:
    # Monthly, on the 3rd (Japan Post publishes updates around month-end)
    - cron: "23 4 3 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python3 test_watch.py

      - name: Check for updates
        id: check
        run: |
          ym="$(date +%Y-%m)"
          python3 watch.py check \
            --snapshot data/snapshot \
            --new https://www.post.japanpost.jp/service/search/zipcode/download/utf/zip/utf_ken_all.zip \
            --date "$(date +%F)" \
            --events-json "changes/events_${ym}.json" \
            --events-csv "changes/events_${ym}.csv" \
            --update-snapshot | tee /tmp/check_out.txt
          if grep -q "HAS_CHANGES=1" /tmp/check_out.txt; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit changes
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/snapshot changes/
          git commit -m "Postal code data updated"
          git push
